name: Medigram
description: >-
  Medigram, Inc. is a healthcare AI governance company founded by Sherri Douville
  that builds Darwin, a governed decision platform for high-stakes clinical and
  performance AI. Darwin implements the sociotechnical data-governance architecture
  defined in IEEE UL 2933 (the six-dimension TIPPSS framework: Trust, Identity,
  Privacy, Protection, Safety, Security) and ANSI/HSI 2800:2025, scoring AI systems
  against a five-level maturity model and crosswalking them to ten governance
  frameworks (IEEE UL 2933, ANSI/HSI 2800:2025, ISO 42001, OWASP Agentic AI Top 10,
  NIST AI RMF, FDA, EU AI Act, and the HSCC guides). Applications include medtech
  AI governance, health-system IT review, and professional-sports player-health
  governance. Historically Medigram provided a secure, cloud-based mobile
  communication platform for healthcare professionals. Medigram is a portfolio
  company surfaced from the a16z network; it publishes marketing and standards
  content but no public developer API surface at this time.
